name: sclsd
channels:
  - pytorch
  - nvidia
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - pytorch>=2.0
  - pytorch-cuda=12.4
  - numpy>=1.24,<2.0
  - scipy>=1.10
  - pandas>=2.0
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - seaborn>=0.13
  - h5py
  - bioconda::gseapy
  - jupyter
  - jupyterlab
  - ipykernel
  - ipywidgets
  - tqdm
  - pip
  - pip:
    - pyro-ppl==1.9.1
    - torchdiffeq==0.2.5
    - scanpy==1.9.8
    - anndata==0.9.2
    - cellrank==2.0.5
    - scvelo==0.3.3
    - leidenalg
    - umap-learn
    - pynndescent
    - adjustText
    - pytest
    - pytest-cov
    - black
    - ruff
    - mypy
    - pre-commit
